<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div id="tvchart" style="width: 600px; height: 400px;"></div>
  <script>
    const chart = LightweightCharts.createChart(document.getElementById('tvchart'), {
      width: 600, height: 400
    });
    
    // Candlesticks
    const candleSeries = chart.addCandlestickSeries();
    candleSeries.setData([
      { time: '2018-12-22', open: 75.16, high: 82.84, low: 36.16, close: 45.72 },
      { time: '2018-12-23', open: 45.12, high: 53.90, low: 45.12, close: 48.09 },
      { time: '2018-12-24', open: 60.71, high: 60.71, low: 53.39, close: 59.29 },
      { time: '2018-12-25', open: 68.26, high: 68.26, low: 59.04, close: 60.50 },
      { time: '2018-12-26', open: 67.71, high: 105.85, low: 66.67, close: 91.04 },
    ]);
    
    chart.priceScale('right').applyOptions({
      scaleMargins: { top: 0.1, bottom: 0.3 }
    });

    // RSI Pane Background (BaselineSeries)
    const paneBg = chart.addBaselineSeries({
      priceScaleId: 'RSI_1',
      baseValue: { type: 'price', price: -100 },
      topFillColor1: 'rgba(255, 0, 0, 1)', // Red
      topFillColor2: 'rgba(255, 0, 0, 1)',
      bottomFillColor1: 'rgba(255, 0, 0, 1)',
      bottomFillColor2: 'rgba(255, 0, 0, 1)',
      topLineColor: 'transparent',
      bottomLineColor: 'transparent',
      lineWidth: 0,
      crosshairMarkerVisible: false,
      priceLineVisible: false,
      lastValueVisible: false,
      autoscaleInfoProvider: () => ({ priceRange: { minValue: 40, maxValue: 60 } })
    });
    paneBg.setData([
      { time: '2018-12-22', value: 200 },
      { time: '2018-12-23', value: 200 },
      { time: '2018-12-24', value: 200 },
      { time: '2018-12-25', value: 200 },
      { time: '2018-12-26', value: 200 },
    ]);

    chart.priceScale('RSI_1').applyOptions({
      scaleMargins: { top: 0.75, bottom: 0 }
    });
  </script>
</body>
</html>
